# Локальный MongoDB для интеграционных тестов (go test ./...).
# URI в тестах: mongodb://localhost:27017
#
# Запуск:
#   docker compose up -d
#   docker compose ps          # ждать healthy
#   go test ./...
#   docker compose down
#
# Если в логах: "No space left on device" — у Docker Desktop закончилось место
# на виртуальном диске (не обязательно совпадает со свободным местом на macOS):
#   docker compose down -v
#   docker system prune -af --volumes   # освободить образы/кэш/тома (осторожно)
#   docker builder prune -af            # только build cache (~десятки GB)
#
# Данные хранятся в tmpfs (RAM), после down не остаются — для тестов этого достаточно.
name: lungo-mongo

services:
  mongodb:
    image: mongo:8.0
    container_name: lungo-mongodb
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db:size=1024m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 25s
